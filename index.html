<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>日亚 Switch 游戏订单管理 Pro</title>
<style>
body{font-family:Arial;margin:0;background:#f4f6f8}
.header{background:#222;color:#fff;padding:15px 20px}
.wrap{display:flex;flex-direction:column;height:auto;min-height:100vh}
@media (min-width: 768px){
  .wrap{flex-direction:row;height:calc(100vh - 60px);}
  .left{width:35%;border-right:1px solid #ddd;}
  .right{flex:1;}
}
.left{width:100%;overflow:auto;background:#fff;padding:15px;box-sizing:border-box}
.right{width:100%;overflow:auto;padding:15px;box-sizing:border-box}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:12px}
input,select{padding:6px;margin-top:4px;width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:4px;}
button{padding:6px 10px;margin:6px 2px 2px 0;cursor:pointer;border:0;border-radius:4px;background:#eee;}
.order{border:1px solid #ddd;padding:10px;margin-bottom:8px;border-radius:8px;cursor:pointer}
.order:hover{background:#f8f8f8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{color:#666;font-size:12px}
.filter button{margin-right:6px}
.hidden{display:none;}
.check-item{display:flex;align-items:center;gap:4px;margin-top:8px;margin-bottom:4px;}
.check-item input{width:auto;}
.time-item{margin: 8px 0;}
/* 新增日期筛选样式 */
.date-filter{margin:8px 0;}
.date-filter input{width:auto;min-width:180px;}
</style>
</head>
<body>
<div class="header">
<h2>日亚 Switch 游戏订单管理 Pro</h2>
</div>
<div class="wrap">
<div class="left">
<div class="card">
<h3>新建订单</h3>
<label>归属人</label>
<select id="owner">
<option value="🍻">🍻</option>
<option value="🚗">🚗</option>
</select>
<label>游戏</label>
<select id="game">
<option>喷喷3</option>
<option>人森</option>
<option>其他</option>
</select>
<div id="otherBox" style="display:none">
<label>游戏名称<input id="otherName"></label>
<label>价格(日元)<input id="otherJPY" type="number"></label>
</div>
<button onclick="createOrder()">创建订单</button>
</div>
<div class="card">
<h3>订单列表</h3>
<div class="filter">
<button onclick="setFilter('all')">全部</button>
<button onclick="setFilter('🍻')">🍻</button>
<button onclick="setFilter('🚗')">🚗</button>
<!-- 新增日期筛选区域 -->
<div class="date-filter">
<label>按下单日期筛选：</label>
<input type="date" id="orderDateFilter">
<button onclick="filterByDate()">筛选</button>
<button onclick="clearDateFilter()">清空日期筛选</button>
</div>
</div>
<div id="orderList"></div>
</div>
</div>
<div class="right">
<div id="detail"><div class="card">请选择订单</div></div>
</div>
</div>
<script>
let currentFilter="all";
let currentDateFilter = ""; // 新增：存储当前日期筛选条件

function setFilter(f){
 currentFilter=f;
 renderList();
}

// 新增：按日期筛选订单
function filterByDate() {
  const dateInput = document.getElementById("orderDateFilter");
  currentDateFilter = dateInput.value;
  renderList();
}

// 新增：清空日期筛选
function clearDateFilter() {
  document.getElementById("orderDateFilter").value = "";
  currentDateFilter = "";
  renderList();
}

// 获取标准时间格式
function nowStr(){
 const d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+
 String(d.getDate()).padStart(2,'0')+" "+
 String(d.getHours()).padStart(2,'0')+":"+
 String(d.getMinutes()).padStart(2,'0');
}

// 辅助函数：提取日期（YYYY-MM-DD）
function getDateStr(timeStr) {
  return timeStr.split(" ")[0]; // 从 "YYYY-MM-DD HH:MM" 中提取日期部分
}

// 本地存储操作
function save(data){
 localStorage.setItem("jpOrders",JSON.stringify(data));
}
function load(){
 return JSON.parse(localStorage.getItem("jpOrders")||"[]");
}

// 切换游戏为其他时展示输入框
document.getElementById("game").onchange=()=>{
 document.getElementById("otherBox").style.display=
 document.getElementById("game").value==="其他"?"block":"none";
}

// 新建订单
function createOrder(){
 let game=document.getElementById("game").value;
 let name=game;
 let jpy=0;
 if(game==="喷喷3") jpy=5787;
 if(game==="人森") jpy=6390;
 if(game==="其他"){
   name=document.getElementById("otherName").value;
   jpy=document.getElementById("otherJPY").value;
 }
 let data=load();
 data.push({
 id:"ORD"+Date.now(),
 owner:document.getElementById("owner").value,
 game:name,
 jpy:jpy,
 orderTime:nowStr(),
 codeStatus:false,
 code:"",
 codeTime:"",
 sold:false,
 salePrice:(game==="喷喷3"?250:(game==="人森"?275:"")),
 soldTime:"",
 fx:false,
 fxAmount:"",
 fxTime:"",
 sellWay:"直接转账",
 isReceive:false,
 receiveTime:"",
 isTransfer:false, // 是否转钱
 transferTime:""   // 转钱时间
 });
 save(data);
 renderList();
}

// 渲染订单列表，增加日期筛选和转钱状态展示
function renderList(){
 let data=load().slice().reverse();
 // 1. 归属人筛选
 if(currentFilter!=="all"){
   data=data.filter(o=>o.owner===currentFilter);
 }
 // 2. 日期筛选
 if(currentDateFilter) {
   data = data.filter(o => getDateStr(o.orderTime) === currentDateFilter);
 }
 let html="";
 data.forEach(o=>{
   let statusText = [];
   if(o.codeStatus) statusText.push('🎮已出码');
   if(o.sold) statusText.push('💰已售出');
   if(o.fx) statusText.push('💱已购汇');
   if(o.isReceive) statusText.push('✅已确收');
   if(o.isTransfer) statusText.push('💸已转钱'); // 新增：展示转钱状态
   if(statusText.length === 0) statusText.push('🛒已下单');

   html+=`
   <div class="order" onclick="showOrder('${o.id}')">
   <b>${o.owner} ${o.game}</b><br>
   <span class="small">${o.id}</span><br>
   <span class="small">下单时间：${o.orderTime}</span><br> <!-- 新增：显示下单时间 -->
   <span class="small">${statusText.join(' | ')}</span>
   </div>`;
 });
 document.getElementById("orderList").innerHTML=html;
}

// 展示订单详情（新增标记转钱功能）
function showOrder(id){
 let data=load();
 let o=data.find(x=>x.id===id);
 // 售出方式下拉框，保留两个选项，无额外联动逻辑
 let sellWayHtml = `
  <label>售出方式</label>
  <select id="sellWay_${id}">
    <option value="直接转账" ${o.sellWay==='直接转账'?'selected':''}>直接转账</option>
    <option value="走闲鱼" ${o.sellWay==='走闲鱼'?'selected':''}>走闲鱼</option>
  </select>
 `;
 let transferHtml = '';
 if(o.owner === '🚗'){
  transferHtml = `
  <div class="time-item">
    <label>转钱时间</label>
    <input id="transferTime_${id}" value="${o.transferTime||''}">
    <button onclick="markTransfer('${id}')">标记转钱</button>
  </div>
  `;
 }

 // 页面布局：确收区域固定显示
 document.getElementById("detail").innerHTML=`
 <div class="card">
 <h2>${o.owner} ${o.game}</h2>
 <div class="grid">
 <div>
 <label>订单号</label>
 <input value="${o.id}" readonly>
 </div>
 <div>
 <label>日元成本</label>
 <input value="${o.jpy}">
 </div>
 <div>
 <label>下单时间</label>
 <input id="orderTime_${id}" value="${o.orderTime}">
 </div>
 <div>
 <label>兑换码</label>
 <input id="code_${id}" value="${o.code||''}">
 </div>

 <div class="time-item">
  <label>出码时间</label>
  <input id="codeTime_${id}" value="${o.codeTime}">
  <button onclick="markCode('${id}')">标记出码</button>
 </div>

 <div class="time-item">
  <label>售出时间</label>
  <input id="soldTime_${id}" value="${o.soldTime}">
  <button onclick="markSold('${id}')">标记售出</button>
 </div>

 <div>
 ${sellWayHtml}
 </div>

 <!-- 确收区域：固定显示 -->
 <div class="time-item">
  <label>确收时间</label>
  <input id="receiveTime_${id}" value="${o.receiveTime||''}">
  <button onclick="markReceive('${id}')">标记确收</button>
 </div>

 <div class="time-item">
  <label>购汇金额（美元）</label>
  <input id="fxAmount_${id}" value="${o.fxAmount||''}" type="number" step="0.01">
  <button onclick="markFX('${id}')">标记购汇</button>
 </div>

 <div>
 <label>售价</label>
 <input id="price_${id}" value="${o.salePrice||''}">
 </div>

 <!-- 新增：转钱区域 -->
 ${transferHtml}

 </div>
 <hr>
 <button onclick="saveEdit('${id}')">保存修改</button>
 <button onclick="deleteOrder('${id}')">删除</button>
 </div>`;
}

// 通用更新方法
function update(id,fn){
 let data=load();
 let o=data.find(x=>x.id===id);
 fn(o);
 save(data);
 renderList();
 showOrder(id);
}

// 保存所有编辑内容（新增转钱时间保存）
function saveEdit(id){
 update(id,o=>{
   o.orderTime=document.getElementById("orderTime_"+id).value;
   o.code=document.getElementById("code_"+id).value;
   o.codeTime=document.getElementById("codeTime_"+id).value;
   o.soldTime=document.getElementById("soldTime_"+id).value;
   o.salePrice=document.getElementById("price_"+id).value;
   o.sellWay = document.getElementById("sellWay_"+id).value;
   o.receiveTime = document.getElementById("receiveTime_"+id).value;
   o.fxAmount = document.getElementById("fxAmount_"+id).value;
   // 新增：保存转钱时间
   if(document.getElementById("transferTime_"+id)){
     o.transferTime = document.getElementById("transferTime_"+id).value;
   }
 });
}

// 标记出码
function markCode(id){
 update(id,o=>{
   o.codeStatus=true;
   if(!o.codeTime) o.codeTime=nowStr();
 });
}

// 标记售出
function markSold(id){
 update(id,o=>{
   o.sold=true;
   if(!o.soldTime) o.soldTime=nowStr();
 });
}

// 标记购汇
function markFX(id){
 update(id,o=>{
   o.fx=true;
   if(!o.fxTime) o.fxTime=nowStr();
 });
}

// 标记确收
function markReceive(id){
 update(id,o=>{
   o.isReceive=true;
   if(!o.receiveTime) o.receiveTime=nowStr();
 });
}

// 新增：标记转钱
function markTransfer(id) {
 update(id,o=>{
   o.isTransfer=true;
   if(!o.transferTime) o.transferTime=nowStr();
 });
}

// 删除订单
function deleteOrder(id){
 if(!confirm("确定删除？")) return;
 let data=load().filter(x=>x.id!==id);
 document.getElementById("detail").innerHTML='<div class="card">请选择订单</div>';
 save(data);
 renderList();
}

// 页面初始化
renderList();
</script>
</body>
</html>
